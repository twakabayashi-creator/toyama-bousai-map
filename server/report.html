<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>協賛レポート｜とやま防災めぐり</title>
<link rel="stylesheet" href="/style.css">
<style>
  .doc{max-width:960px;margin:0 auto;background:var(--surface);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
  .doc h1{font-size:24px;margin:0}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
  .row label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
  .row input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
  .tbl{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left;white-space:normal}
  tfoot td{font-weight:900}
  .kpi{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="doc">
  <h1>協賛スポット レポート</h1>
  <form class="row" id="f">
    <label>パスワード<input type="password" id="pw" autocomplete="current-password" required></label>
    <label>開始日<input type="date" id="from"></label>
    <label>終了日<input type="date" id="to"></label>
    <button class="btn">表示する</button>
    <button class="btn ghost" type="button" id="dl" hidden>CSVでダウンロード</button>
  </form>
  <p class="note" id="msg">パスワードを入れて「表示する」を押してください。</p>
  <div class="kpi" id="kpi"></div>
  <div class="tbl"><table id="t"></table></div>
  <p class="note">「見た」「アプリを開いた」は、同じ端末からは1日1回まで数えています。個人を特定できる情報は集めていません。</p>
</div>
<script src="/report.js"></script>
</body>
</html>
